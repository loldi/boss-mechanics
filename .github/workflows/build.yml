name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is a committed binary, so verify it matches a known
      # Gradle release before running it.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      # Compiles the plugin and runs the boss data validation tests, so a data
      # PR that breaks the schema fails here rather than in review.
      - run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/test/
          if-no-files-found: ignore
