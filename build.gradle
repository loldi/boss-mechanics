plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.bossmechanics'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Launches a RuneLite client with this plugin sideloaded.
// BossMechanicsPluginTest is a main() launcher, not a JUnit test, so `test --tests`
// will not run it.
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with the Boss Mechanics plugin sideloaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bossmechanics.BossMechanicsPluginTest'
    args = ['--developer-mode']
    // RuneLite refuses to start without assertions enabled.
    jvmArgs = ['-ea']
}
